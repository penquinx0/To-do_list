<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List Project</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">TaskMaster</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
        </ul>
    </nav>

    <div class="mainheading">
        <h1 class="main-title">Conquer Your Day.</h1>
        <p class="sub-title">A simple and neat way to manage your daily tasks.</p>
    </div>

    <div class="container">
        <header>
            <h1>To Do List</h1>
            <p>Stay organized, Stay focused.</p>
        </header>

        <main>
            <div class="input-area">
                <input type="text" id="taskInput" placeholder="What do you need to do?">
                <button id="addBtn">Add Task</button>
            </div>
            
            <ul id="taskList">
                </ul>

            <div class="action-bar">
                <button id="clearAllBtn" class="clear-all-btn">Clear All Tasks</button>
            </div>
        </main>

</body>
</html>
